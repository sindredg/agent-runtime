name: agent-runtime

# Shared by every service built from the Dockerfile.
x-runtime: &runtime
  # Built once, by the migrate service. The others reuse the local image and
  # never try to pull it.
  image: agent-runtime:dev
  pull_policy: never
  # A tiny init process as PID 1, so SIGTERM reaches the service and it stops promptly.
  init: true
  # The container cannot write to its own filesystem, only to /tmp in memory.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Development default, for the services inside the compose network.
x-database-url: &database-url >-
  postgresql://runtime:${POSTGRES_PASSWORD:-runtime-dev}@postgres:5432/runtime

# urllib because the slim image has no curl.
x-http-healthcheck: &http-healthcheck
  test:
    - CMD
    - python
    - -c
    - >-
      import urllib.request;
      urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  postgres:
    # yamllint disable-line rule:line-length
    image: postgres:18.7-trixie@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    environment:
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runtime-dev}
      POSTGRES_DB: runtime
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>.
      - postgres-data:/var/lib/postgresql
    ports:
      # Published on localhost only, for the integration tests and psql.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready --username runtime --dbname runtime"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the schema migrations and must exit 0 before api and
  # worker start.
  migrate:
    <<: *runtime
    build: .
    pull_policy: build
    command: [alembic, upgrade, head]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    command: [python, -m, runtime.api]
    environment:
      DATABASE_URL: *database-url
      # All interfaces inside the container; the port is published on
      # localhost only, below.
      API_HOST: 0.0.0.0
    ports:
      # Published on localhost only: the API has no authentication.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck: *http-healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *runtime
    command: [python, -m, runtime.worker]
    # On SIGTERM the worker waits for a running tool, stores its result and
    # gives the job back. After this long Docker kills it, and the job is
    # taken over when its lease runs out. The worker gets the same number as
    # STOP_GRACE_SECONDS and refuses to start if a sandboxed call does not
    # fit in it.
    stop_grace_period: ${STOP_GRACE_SECONDS:-75}s
    # The group that owns the Docker socket, so the worker can start a
    # container for each sandboxed tool call. Whoever controls the worker
    # controls the host (ADR 0008). `make` sets the variable.
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group id of /var/run/docker.sock}"
    environment:
      DATABASE_URL: *database-url
      # The fake provider unless .env says otherwise. The compose variables
      # have their own names, so an ANTHROPIC_API_KEY exported in the shell
      # never reaches the stack by accident.
      ANTHROPIC_BASE_URL: ${PROVIDER_BASE_URL:-http://fake-provider:8000}
      ANTHROPIC_API_KEY: ${PROVIDER_API_KEY:-not-a-real-key}
      MODEL: ${PROVIDER_MODEL:-hello}
      # On a volume that every worker mounts: a job that is taken over
      # keeps the files its tools wrote.
      WORKSPACE_ROOT: /workspaces
      # The issue tracker the create_issue tool talks to.
      TRACKER_URL: ${TRACKER_URL:-http://fake-tracker:8000}
      # Seconds a claim holds a job. A job whose lease ran out is taken over.
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      # Seconds between two renewals of the lease. Shorter than the lease.
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-10}
      # Sandboxed tools run in this image. Each call gets its job's
      # directory of the workspace volume, and nothing else of the host.
      SANDBOX_IMAGE: agent-runtime-sandbox:dev
      SANDBOX_VOLUME: agent-runtime_workspaces
      # A job with a scope gets a guard container per call on this network,
      # and no scope can reach the subnets of the networks in the deny list.
      GUARD_IMAGE: agent-runtime-guard:dev
      SANDBOX_NETWORK: agent-runtime_sandbox
      SANDBOX_DENY_NETWORKS: agent-runtime_default
      # Seconds a sandboxed command may run before it is killed.
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-30}
      # The stop_grace_period above, in seconds.
      STOP_GRACE_SECONDS: ${STOP_GRACE_SECONDS:-75}
    volumes:
      - workspaces:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # Healthy while the liveness file was touched in the last 15 seconds.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sys, time;
          sys.exit(time.time() - os.path.getmtime('/tmp/worker.alive') > 15)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      fake-provider:
        condition: service_healthy
      fake-tracker:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
      guard-image:
        condition: service_completed_successfully

  # One-shot: builds the image that sandboxed tool calls run in, and shows
  # that it starts. The worker starts those containers, not compose.
  sandbox-image:
    build: images/sandbox
    image: agent-runtime-sandbox:dev
    pull_policy: build
    command: ["true"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One-shot: builds the image of the guard that holds a scoped call's
  # firewall, shows nftables runs, and exits. It also makes compose create
  # the network the guards join.
  guard-image:
    build: images/guard
    image: agent-runtime-guard:dev
    pull_policy: build
    command: ["nft", "--version"]
    networks:
      - sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  fake-provider:
    <<: *runtime
    command: [uvicorn, fake_provider.app:app, --host, 0.0.0.0, --port, "8000"]
    ports:
      # Published on localhost only, so tests can read its request log.
      - "127.0.0.1:${FAKE_PROVIDER_PORT:-8001}:8000"
    healthcheck: *http-healthcheck

  # A stand-in for an issue tracker: the outside system the create_issue
  # tool changes. It keeps its issues in memory.
  fake-tracker:
    <<: *runtime
    command: [uvicorn, fake_tracker.app:app, --host, 0.0.0.0, --port, "8000"]
    ports:
      # Published on localhost only, so tests can read its list of issues.
      - "127.0.0.1:${FAKE_TRACKER_PORT:-8002}:8000"
    healthcheck: *http-healthcheck

networks:
  # Where the guards of scoped tool calls run. Only guards join it, and its
  # own subnet is in the deny list, so one job's tools cannot reach another's.
  sandbox:
    name: agent-runtime_sandbox

volumes:
  postgres-data:
  # Job workspaces, one directory per job, shared by the workers. Named
  # explicitly: the worker passes this name to Docker for each tool container.
  workspaces:
    name: agent-runtime_workspaces
