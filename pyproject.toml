[project]
name = "agent-runtime"
version = "0.0.0"
description = "Runs long AI agent jobs so they survive crashes, rate limits, and bad tool output."
readme = "README.md"
requires-python = "==3.15.*"
dependencies = [
    # Schema migrations, run by the one-shot migrate service.
    "alembic==1.20.1",
    # The official SDK for the Messages API. It parses the event stream and
    # maps HTTP errors to typed exceptions.
    "anthropic==2.8.0",
    "asyncpg==0.32.0",
    "fastapi==0.162.6",
    # HTTP client for the CLI, and for FastAPI's TestClient in tests. httpx2 is
    # the maintained successor to httpx.
    "httpx2==2.16.0",
    # Request and response models. FastAPI installs it anyway.
    "pydantic==2.14.3",
    # The asyncio extra adds greenlet, which SQLAlchemy needs to drive asyncpg.
    "sqlalchemy[asyncio]==2.1.8",
    # The ASGI server that runs the FastAPI apps.
    "uvicorn==0.54.0",
]

[project.scripts]
runtime = "runtime.cli:run"

[dependency-groups]
dev = [
    # asyncpg ships no type information; mypy --strict needs these.
    "asyncpg-stubs==0.32.0",
    # The workspace member, so tests can import it.
    "fake-provider",
    # Property-based tests: generated inputs instead of hand-picked ones.
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
    # Lints the workflow and config YAML, so every kind of file in the
    # repository has a linter in CI.
    "yamllint==1.38.0",
]

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["services/fake_provider"]

[tool.uv.sources]
fake-provider = { workspace = true }

[tool.uv.build-backend]
# The import package is `runtime`, not the project name.
module-name = "runtime"

[tool.alembic]
# Configured here instead of in an alembic.ini. %(here)s is this file's directory.
script_location = "%(here)s/migrations"

[tool.ruff]
line-length = 100
src = ["src", "tests", "services/fake_provider/src"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# SIM simplifications, ASYNC asyncio mistakes, S security, RUF ruff's own.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest rewrites assert; S101 (assert used) does not apply in tests.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations", "scripts", "services/fake_provider/src"]

[tool.pytest.ini_options]
# A bare `pytest` runs the unit tests. The other suites need the stack or a key
# and are named explicitly.
testpaths = ["tests/unit"]
# A typo in a marker or a config key fails the run instead of being ignored.
addopts = "--strict-markers --strict-config"
# A warning, such as a deprecation in a dependency, fails the run.
filterwarnings = ["error"]
