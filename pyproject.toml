[project]
name = "agent-runtime"
version = "0.0.0"
description = "Runs long AI agent jobs so they survive crashes, rate limits, and bad tool output."
readme = "README.md"
requires-python = "==3.15.*"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
    # Lints the workflow and config YAML, so every kind of file in the
    # repository has a linter in CI.
    "yamllint==1.38.0",
]

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import package is `runtime`, not the project name.
module-name = "runtime"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# SIM simplifications, ASYNC asyncio mistakes, S security, RUF ruff's own.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest rewrites assert; S101 (assert used) does not apply in tests.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo in a marker or a config key fails the run instead of being ignored.
addopts = "--strict-markers --strict-config"
