name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types and tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # uv installs the Python in .python-version and the locked tools.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      # --locked, not --frozen: a pin edited in pyproject.toml without a relock fails here.
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -v tests/unit

  yaml:
    name: YAML and workflow lint
    runs-on: ubuntu-26.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # From actionlint_1.7.12_checksums.txt, copied into this file so a
      # replaced release asset fails the check. Moves by hand with the version.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked
      - run: uv run --frozen yamllint --strict .
      - name: JSON syntax
        run: git ls-files -z '*.json' | xargs -0 uv run --frozen python scripts/lint_json.py
      # Fails on a page that is too long, has a long paragraph or table
      # cell, has no diagram, or links to a page or heading that is not there.
      - name: Docs limits
        run: git ls-files -z '*.md' | xargs -0 uv run --frozen python scripts/lint_docs.py
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  stack:
    name: Images and compose stack
    runs-on: ubuntu-26.04
    env:
      # Checksums are copied from each release's checksum file, so a replaced
      # release asset fails the check. They move by hand with the version.
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      CHECKMAKE_VERSION: "0.3.2"
      CHECKMAKE_SHA256: e2effb876913f3ee2caef0ba35f6202c5e8a3cd55a077d8d2b9ce2034257b6af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile images/sandbox/Dockerfile images/guard/Dockerfile
      - name: checkmake
        run: |
          curl -fsSL -o "$RUNNER_TEMP/checkmake" \
            "https://github.com/checkmake/checkmake/releases/download/v${CHECKMAKE_VERSION}/checkmake-v${CHECKMAKE_VERSION}.linux.amd64"
          echo "$CHECKMAKE_SHA256  $RUNNER_TEMP/checkmake" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/checkmake"
          "$RUNNER_TEMP/checkmake" Makefile
      # The Claude override is checked with a made-up key: config never
      # starts anything, and --quiet prints nothing.
      - name: Validate the compose files
        run: |
          docker compose config --quiet
          CLAUDE_API_KEY=not-a-real-key docker compose \
            -f docker-compose.yml -f docker-compose.claude.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.lab.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.kills.yml config --quiet
          CLAUDE_API_KEY=not-a-real-key docker compose \
            -f docker-compose.yml -f docker-compose.kills.yml \
            -f docker-compose.claude.yml config --quiet
      # Builds the image and fails unless every service becomes healthy and
      # the one-shot migrate service exits 0.
      - name: Start the stack
        run: make up
      - name: Call the API from the host
        run: curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/healthz
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: make clean

  integration:
    name: Integration tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # Postgres with the migrations applied. The tests run on the host and
      # reach it on 127.0.0.1:5432.
      - name: Start the stack
        run: make up
      - name: Integration tests
        run: uv run --frozen pytest -v tests/integration
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: make clean

  escape:
    name: Escape tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked
      # Builds the sandbox image and runs the escape attempts against it. No
      # stack: the tests start the tool containers themselves.
      - name: Escape tests
        run: make escape

  chaos:
    name: Chaos tests (short run)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Random kills in the short run. The seed is the default in the tests.
      CHAOS_RUNS: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # Starts the stack with three workers and a short lease, then kills,
      # pauses and crashes workers and checks what is left.
      - name: Chaos tests
        run: make chaos
      - name: Results
        if: always()
        run: cat .chaos/results.jsonl
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: make clean

  lab:
    name: Lab demo
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # Sets Gitea up in a container, stops a worker in the middle of a
      # create_issue call to it, and counts the issues in Gitea.
      - name: Lab demo
        run: make lab
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.lab.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: make clean

  kills:
    name: Kill runs (fake provider)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # Kills workers at random times and stops them inside the call that
      # opens an issue, and judges each job without a reference run. Always
      # the fake provider here: the Claude API needs a key, and no secret is
      # given to this workflow.
      - name: Kill runs
        run: make kills
      - name: Results
        if: always()
        run: cat .kills/*/results.jsonl
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.kills.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: make clean
