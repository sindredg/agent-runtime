name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step with a `run` stops workflow commands while it runs, with a
# token made in the step, unless it prints nothing from the stack or the
# tests. setup-uv runs without its problem matchers.
# tests/unit/test_workflow_commands.py checks both.
#
# A pull request into main that changes only files under docs/ runs the lint
# jobs and `changes`, and skips the jobs that build or start the stack. A job skipped
# by its `if` reports success, so the required checks still report. The gate
# skips only on an explicit `false`: if `changes` fails, everything runs.
# tests/unit/test_ci_jobs.py checks which jobs are gated.
jobs:
  changes:
    name: Paths the change touches
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request is checked out as its merge commit, whose first parent
      # is the base. --no-renames lists a moved file's old path too. Only a
      # pull request into main may skip: a change of base does not run CI
      # again, so one into another branch runs everything. A push to main
      # runs everything. scripts/ci_paths.py prints the output.
      - name: Paths outside the docs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE" = main ]; then
            git diff --name-only --no-renames HEAD^1 HEAD \
              | python3 -I scripts/ci_paths.py >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Python lint, types and tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # uv installs the Python in .python-version and the locked tools.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      # --locked, not --frozen: a pin edited in pyproject.toml without a relock fails here.
      - name: Sync the environment
        run: uv sync --locked
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: mypy
        run: uv run --frozen mypy
      - name: Unit tests
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          uv run --frozen pytest -v tests/unit
          echo "::$token::"

  yaml:
    name: YAML and workflow lint
    runs-on: ubuntu-26.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # From actionlint_1.7.12_checksums.txt, copied into this file so a
      # replaced release asset fails the check. Moves by hand with the version.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      - name: yamllint
        run: uv run --frozen yamllint --strict .
      - name: JSON syntax
        run: git ls-files -z '*.json' | xargs -0 uv run --frozen python scripts/lint_json.py
      - name: SVG syntax
        run: git ls-files -z '*.svg' | xargs -0 uv run --frozen python scripts/lint_svg.py
      # Fails on a page that is too long, has a long paragraph or table
      # cell, has no diagram, or links to a page or heading that is not there.
      - name: Docs limits
        run: git ls-files -z '*.md' | xargs -0 uv run --frozen python scripts/lint_docs.py
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  stack:
    name: Images and compose stack
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    env:
      # Checksums are copied from each release's checksum file, so a replaced
      # release asset fails the check. They move by hand with the version.
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      CHECKMAKE_VERSION: "0.3.2"
      CHECKMAKE_SHA256: e2effb876913f3ee2caef0ba35f6202c5e8a3cd55a077d8d2b9ce2034257b6af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile images/sandbox/Dockerfile images/guard/Dockerfile
      - name: checkmake
        run: |
          curl -fsSL -o "$RUNNER_TEMP/checkmake" \
            "https://github.com/checkmake/checkmake/releases/download/v${CHECKMAKE_VERSION}/checkmake-v${CHECKMAKE_VERSION}.linux.amd64"
          echo "$CHECKMAKE_SHA256  $RUNNER_TEMP/checkmake" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/checkmake"
          "$RUNNER_TEMP/checkmake" Makefile
      # The Claude override is checked with a made-up key: config never
      # starts anything, and --quiet prints nothing.
      - name: Validate the compose files
        run: |
          docker compose config --quiet
          CLAUDE_API_KEY=not-a-real-key docker compose \
            -f docker-compose.yml -f docker-compose.claude.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.lab.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.kills.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.long.yml config --quiet
          CLAUDE_API_KEY=not-a-real-key docker compose \
            -f docker-compose.yml -f docker-compose.kills.yml \
            -f docker-compose.claude.yml config --quiet
      # Builds the image and fails unless every service becomes healthy and
      # the one-shot migrate service exits 0.
      - name: Start the stack
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make up
          echo "::$token::"
      - name: Call the API from the host
        run: curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/healthz
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          docker compose logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  integration:
    name: Integration tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # Postgres with the migrations applied. The tests run on the host and
      # reach it on 127.0.0.1:5432.
      - name: Start the stack
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make up
          echo "::$token::"
      - name: Integration tests
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          uv run --frozen pytest -v tests/integration
          echo "::$token::"
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          docker compose logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  escape:
    name: Escape tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      # Builds the sandbox image and runs the escape attempts against it. No
      # stack: the tests start the tool containers themselves.
      - name: Escape tests
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make escape
          echo "::$token::"

  chaos:
    name: Chaos tests (short run)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Random kills in the short run. The seed is the default in the tests.
      CHAOS_RUNS: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # Starts the stack with three workers and a short lease, then kills,
      # pauses and crashes workers and checks what is left.
      - name: Chaos tests
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make chaos
          echo "::$token::"
      - name: Results
        if: always()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .chaos/results.jsonl
          echo "::$token::"
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          docker compose logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  lab:
    name: Lab demo
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # Sets Gitea up in a container, stops a worker in the middle of a
      # create_issue call to it, and counts the issues in Gitea.
      - name: Lab demo
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make lab
          echo "::$token::"
      # The demo's end stops Gitea and puts the worker back on the fake
      # tracker. Nothing of the lab may stay running.
      - name: Gitea is stopped after the demo
        run: |
          running=$(docker compose -f docker-compose.yml -f docker-compose.lab.yml \
            ps --status running --quiet gitea)
          test -z "$running"
          worker=$(docker compose ps --quiet worker)
          test "$(printf '%s' "$worker" | grep -c .)" -eq 1
          docker exec "$worker" printenv TRACKER_URL | grep -qx 'http://fake-tracker:8000'
          docker exec "$worker" printenv NOTIFY_URL \
            | grep -qx 'http://fake-receiver:8000/notifications'
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          docker compose -f docker-compose.yml -f docker-compose.lab.yml logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  kills:
    name: Kill runs (fake provider)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # Kills workers at random times and stops them inside the call that
      # opens an issue, and judges each job without a reference run. Always
      # the fake provider here: the Claude API needs a key, and no secret is
      # given to this workflow.
      - name: Kill runs
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make kills
          echo "::$token::"
      - name: Results
        if: always()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .kills/*/results.jsonl 2>/dev/null || echo "No results, stopped before a test."
          echo "::$token::"
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          docker compose -f docker-compose.yml -f docker-compose.kills.yml logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  long:
    name: Long job (fake provider, ${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # The suite's tests split over three runners. Each runner starts its own
    # stack and runs its own uninterrupted job to compare with, so each also
    # runs the test that judges that job. The planned kills alone take about
    # 13 minutes. tests/unit/test_ci_jobs.py checks the split.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: planned kills
            tests: >-
              test_a_job_longer_than_the_window_finishes_through_three_summaries
              test_jobs_killed_at_planned_requests_send_what_the_uninterrupted_job_sent
          - part: tracker numbers and takeovers
            tests: >-
              test_a_job_longer_than_the_window_finishes_through_three_summaries
              test_issue_numbers_of_the_same_width_move_no_summary_and_a_wider_number_does
              test_a_takeover_by_workers_with_another_trigger_sends_what_the_first_would_have
          - part: summaries
            tests: >-
              test_a_job_longer_than_the_window_finishes_through_three_summaries
              test_a_job_stopped_after_its_first_summary_sends_what_the_uninterrupted_job_sent
              test_a_job_stopped_at_a_summary_request_sends_what_the_uninterrupted_job_sent
              test_a_bad_summary_answer_fails_the_job_and_nothing_runs_after_it
              test_a_window_that_opens_at_the_trigger_fails_the_job_for_it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      # Every compose command needs the group of the Docker socket, which the
      # worker joins to start tool containers. `make` sets it; the steps that
      # call compose directly read it from here.
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # One job longer than the fake provider's context window: with nobody
      # interrupting it, with workers stopped and killed at its summaries,
      # with bad summary answers, other issue numbers and other triggers.
      # Every request the fake provider got is compared with the first run's.
      - name: Long job
        env:
          LONG_TESTS: ${{ matrix.tests }}
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make long
          echo "::$token::"
      - name: Results
        if: always()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .long/*/results.jsonl 2>/dev/null || echo "No results, stopped before a test."
          echo "::$token::"
      # The suite goes on after a failed run and makes the workers again, so
      # the logs it saved hold what the containers' own logs no longer do.
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .long/*/logs/*.log 2>/dev/null || echo "No saved worker logs."
          docker compose -f docker-compose.yml -f docker-compose.long.yml logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  long-job:
    name: Long job harness (fake provider)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # The job of the committed public seed's access review, with the fake
      # provider playing a reviewer that reads every file, killed three
      # times and graded by its outcome. Prints counts only.
      - name: Long job harness
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make long-job
          echo "::$token::"
      - name: Results
        if: always()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .long-job/*/results.jsonl 2>/dev/null || echo "No results, stopped before the job."
          echo "::$token::"
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .long-job/*/logs/*.log 2>/dev/null || echo "No saved worker logs."
          docker compose -f docker-compose.yml -f docker-compose.long.yml logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean
