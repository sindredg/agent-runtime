# Runs started by hand, on a machine with a steady clock (ADR 0020): the
# kill runs and their must-fail run, on the fake provider or the Claude API,
# the contract test, and the switched-off runs of scripts/switched_off.py on
# the fake provider (ADR 0021). Only `workflow_dispatch` starts this workflow.
#
# A job on the Claude API names the `claude-api` environment. It waits for a
# reviewer of that environment, and only then gets the key, as an
# environment secret. The environment allows `main` and `must-fail/*`.
name: Manual runs

on:
  workflow_dispatch:
    inputs:
      suite:
        description: kills, kills-after-tool-ran (their must-fail run), contract, or switched-off
        type: choice
        options: [kills, kills-after-tool-ran, contract, switched-off]
      switched_off:
        description: For suite switched-off. Always the fake provider; from main only
        type: choice
        # The names in scripts/switched_off.py; a unit test keeps the two equal.
        options:
          - budget-off
          - resume-off
          - unknown-check-reruns
          - claim-cancel-off
          - overdue-timer-off
          - stop-release-off
          - takeover-outlast-off
      provider:
        description: fake costs nothing; claude waits for a reviewer and costs money
        type: choice
        options: [fake, claude]
      model:
        description: The Claude model (ignored on the fake provider)
        type: choice
        options: [claude-haiku-5-5, claude-opus-5-5, claude-fable-5-2]

permissions:
  contents: read

jobs:
  fake:
    name: ${{ inputs.suite }} on the fake provider
    # A switched-off run never reaches the job that holds the key.
    if: inputs.provider == 'fake' || inputs.suite == 'switched-off'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      SUITE: ${{ inputs.suite }}
      SWITCHED_OFF: ${{ inputs.switched_off }}
    steps:
      - name: Refuse the contract test
        if: inputs.suite == 'contract'
        run: |
          echo "The contract test compares the fake with the Claude API: pick provider claude." >&2
          exit 1
      # A switched-off run is evidence for main's code: the list, the edit and
      # the tests are main's, reviewed there.
      - name: Refuse a switched-off run off main
        if: inputs.suite == 'switched-off' && github.ref != 'refs/heads/main'
        run: |
          echo "A switched-off run starts from main only." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Commit
        run: git rev-parse HEAD
      # make reads KILLS_TESTS from the environment.
      - name: Kill runs
        if: inputs.suite == 'kills' || inputs.suite == 'kills-after-tool-ran'
        run: |
          if [ "$SUITE" = kills-after-tool-ran ]; then export KILLS_TESTS=after_tool_ran; fi
          make kills
      # The script prints the edit, the commit, and one verdict per test.
      - name: Switched-off run
        if: inputs.suite == 'switched-off'
        run: make switched-off
      - name: Results
        if: always()
        run: |
          for file in .kills/*/results.jsonl .chaos/results.jsonl; do
            if [ -f "$file" ]; then echo "== $file"; cat "$file"; fi
          done
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: make clean

  claude:
    name: ${{ inputs.suite }} on ${{ inputs.model }}
    if: inputs.provider == 'claude' && inputs.suite != 'switched-off'
    runs-on: ubuntu-26.04
    environment: claude-api
    # One paid run at a time. A run in progress is never cancelled: that
    # would spend the tokens and keep no result.
    concurrency:
      group: claude-api
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      SUITE: ${{ inputs.suite }}
      MODEL: ${{ inputs.model }}
    steps:
      # Only the choice values can reach here today. The check keeps it so if
      # the input ever becomes free text. `case` tests the whole string: grep
      # would pass a value with one good line among others.
      - name: Check the model name
        run: |
          case "$MODEL" in claude-?*) ;; *) echo "Not a model id." >&2; exit 1;; esac
          case "$MODEL" in *[!a-z0-9.-]*) echo "Not a model id." >&2; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No uv cache in the job that holds the key: nothing another run saved
      # is restored here, and nothing is saved from here.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - run: uv sync --locked
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Commit
        run: git rev-parse HEAD
      # The key is given to this step only. The runner never reads it; the
      # workers get it through docker-compose.claude.yml.
      - name: Kill runs on the Claude API
        if: inputs.suite == 'kills' || inputs.suite == 'kills-after-tool-ran'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ "$SUITE" = kills-after-tool-ran ]; then export KILLS_TESTS=after_tool_ran; fi
          make kills-claude KILLS_MODEL="$MODEL"
      # The contract test runs on the host against the normal stack's fake
      # provider and the API.
      - name: Contract test
        if: inputs.suite == 'contract'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          make up
          CONTRACT_MODEL="$MODEL" uv run --frozen pytest -v tests/contract
      - name: Results
        if: always()
        run: |
          cat .kills/*/results.jsonl 2>/dev/null || true
          for file in .contract/*/*; do
            if [ -f "$file" ]; then echo "== $file"; cat "$file"; fi
          done
      # Worker logs hold step kinds and errors, never the key.
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.kills.yml logs --no-color worker
      - name: Stop the stack
        if: always()
        run: make clean
