# Runs started by hand, on a machine with a steady clock (ADR 0020): the
# kill runs and their must-fail run, on the fake provider or the Claude API,
# the contract test, the switched-off runs of scripts/switched_off.py
# (ADR 0021), and the long-job harness of tests/long_job. Each entry of that
# list names its provider: one on the Claude API runs in a job that holds
# the key (ADR 0022), and the entry of the long-job harness runs in the
# `long-job` job. `switched-off-all` runs every entry of the fake provider,
# one job and one verdict each. Only `workflow_dispatch` starts this workflow.
#
# A job on the Claude API names the `claude-api` environment. It waits for a
# reviewer of that environment, and only then gets the key, as an
# environment secret. The environment's branch rule decides which branches
# get that far. This file cannot: a branch runs its own copy of it.
#
# Every step with a `run` stops workflow commands while it runs, with a
# token made in the step, unless it prints nothing from the stack or the
# tests. setup-uv runs without its problem matchers.
# tests/unit/test_workflow_commands.py checks both.
name: Manual runs

on:
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          kills, kills-after-tool-ran (their must-fail run), contract, notify-timing
          (G12's timed run, always on the fake provider), switched-off,
          switched-off-rehearsal (an entry of the Claude API on the fake provider),
          switched-off-all (every entry of the fake provider, whatever provider is picked),
          or long-job (the long-job harness)
        type: choice
        options:
          - kills
          - kills-after-tool-ran
          - contract
          - notify-timing
          - switched-off
          - switched-off-rehearsal
          - switched-off-all
          - long-job
      switched_off:
        description: >-
          For the switched-off suites. From main only. Provider and model have to be
          the entry's: thinking-signature-changed is claude, claude-fable-5-2.
          long-notices-dropped runs as suite long-job, mode must-fail
        type: choice
        # The names in scripts/switched_off.py; a unit test keeps the two equal.
        options:
          - budget-off
          - resume-off
          - unknown-check-reruns
          - claim-cancel-off
          - overdue-timer-off
          - stop-release-off
          - takeover-outlast-off
          - thinking-signature-changed
          - resume-off-random-kills
          - intent-write-off-chaos
          - every-tool-idempotent
          - epoch-check-off
          - gitea-check-not-done
          - issue-marker-off
          - refusal-triggers-off
          - chain-check-off
          - budget-check-off
          - repeat-stop-off
          - claim-deadline-off
          - approval-gate-off
          - approval-gate-off-chaos
          - busy-answer-fails
          - retry-after-ignored
          - claim-ignores-not-before
          - provider-error-fails
          - provider-error-cap-off
          - stream-cut-off
          - result-cut-off
          - tool-timeout-off
          - halt-leaves-the-call-running
          - workspace-watcher-off
          - workspace-precheck-off
          - workspace-entry-cap-off
          - workspace-walk-deadline-off
          - workspace-run-bound-off
          - workspace-timeout-off
          - workspace-stop-signal-off
          - workspace-walk-stop-off
          - takeover-wait-for-a-request-off
          - create-deadline-off
          - abortive-close-off
          - notify-loop-off
          - notify-row-off
          - tool-env-passed-on
          - long-trigger-off
          - long-replay-skips-summary
          - long-summary-cut
          - long-own-trigger
          - long-oversize-off
          - long-notices-dropped
          - tool-result-parse
          - gate-from-text
          - scope-from-text
          - summary-split-blocks
          - guard-drop-uncounted
          - one-call-off
      provider:
        description: fake costs nothing; claude waits for a reviewer and costs money
        type: choice
        options: [fake, claude]
      model:
        description: The Claude model (ignored on the fake provider)
        type: choice
        options: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-2]
      long_job:
        description: >-
          For suite long-job on the Claude API: counts (short jobs, a report and no
          verdict), must-fail (the entry long-notices-dropped) or graded (one full job)
        type: choice
        options: [counts, must-fail, graded]
      token_budget:
        description: >-
          For suite long-job, counts and graded: the tokens of each job. Digits only;
          must-fail takes none
        type: string
        default: ""
      jobs:
        description: For suite long-job, counts only. Digits only
        type: string
        default: ""

permissions:
  contents: read

jobs:
  fake:
    name: >-
      ${{ startsWith(inputs.suite, 'switched-off')
      && format('{0} {1}', inputs.suite, inputs.switched_off) || inputs.suite }}
      on the fake provider
    # A rehearsal and the timed notification run never reach the job that holds
    # the key, whatever provider was picked. Every entry of the fake provider
    # runs in the jobs below instead.
    if: >-
      (inputs.provider == 'fake' || inputs.suite == 'switched-off-rehearsal'
      || inputs.suite == 'notify-timing')
      && inputs.suite != 'switched-off-all'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      SUITE: ${{ inputs.suite }}
      SWITCHED_OFF: ${{ inputs.switched_off }}
    steps:
      - name: Refuse the contract test
        if: inputs.suite == 'contract'
        run: |
          echo "The contract test compares the fake with the Claude API: pick provider claude." >&2
          exit 1
      # A switched-off run is evidence for main's code: the list, the edit and
      # the tests are main's, reviewed there.
      - name: Refuse a switched-off run off main
        if: inputs.suite == 'switched-off' && github.ref != 'refs/heads/main'
        run: |
          echo "A switched-off run starts from main only." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      # An entry of the Claude API does not start here as a run: the script
      # refuses a provider that is not the entry's.
      - name: Check the entry against the provider
        if: inputs.suite == 'switched-off'
        run: uv run --frozen python scripts/switched_off.py dispatch "$SWITCHED_OFF" fake
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Commit
        run: git rev-parse HEAD
      # make reads KILLS_TESTS from the environment.
      - name: Kill runs
        if: inputs.suite == 'kills' || inputs.suite == 'kills-after-tool-ran'
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          if [ "$SUITE" = kills-after-tool-ran ]; then export KILLS_TESTS=after_tool_ran; fi
          make kills
          echo "::$token::"
      # The script prints the edit, the commit, and one verdict per test.
      - name: Switched-off run
        if: inputs.suite == 'switched-off'
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make switched-off
          echo "::$token::"
      # G12 (b): 50 questions, each first delivery within 5 s of its park.
      - name: Timed notification run
        if: inputs.suite == 'notify-timing'
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make notify-timing
          echo "::$token::"
      # Every step of an entry of the Claude API, on the fake provider. Not a result.
      - name: Rehearsal of a switched-off run
        if: inputs.suite == 'switched-off-rehearsal'
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make switched-off-rehearsal
          echo "::$token::"
      # The job of the committed public seed, on the fake provider's reviewer.
      - name: Long job harness
        if: inputs.suite == 'long-job'
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make long-job
          echo "::$token::"
      - name: Results
        if: always()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          for file in .kills/*/results.jsonl .chaos/results.jsonl .notify-timing/results.jsonl \
              .long/*/results.jsonl .long-job/*/results.jsonl; do
            if [ -f "$file" ]; then echo "== $file"; cat "$file"; fi
          done
          echo "::$token::"
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .long/*/logs/*.log .long-job/*/logs/*.log 2>/dev/null || true
          docker compose logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  # Every entry of the fake provider, from main: one job and one verdict per
  # entry. The names come from main's list, never from an input. Neither job
  # holds a secret or names an environment.
  fake-names:
    name: The switched-off entries of the fake provider
    if: inputs.suite == 'switched-off-all'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - name: Refuse a switched-off run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "A switched-off run starts from main only." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      # A JSON list. The assignment fails the step if the script fails.
      - name: Names
        id: names
        run: |
          names=$(uv run --frozen python scripts/switched_off.py names fake)
          echo "names=$names" >> "$GITHUB_OUTPUT"

  fake-entries:
    name: switched-off ${{ matrix.entry }} on the fake provider
    needs: fake-names
    if: inputs.suite == 'switched-off-all'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      # Every entry gets its verdict: a red one does not cancel the others.
      fail-fast: false
      matrix:
        # The fallback only keeps the expression valid if it is ever read with an
        # empty output; the job's `if` and `needs` come first.
        entry: ${{ fromJSON(needs.fake-names.outputs.names || '[""]') }}
    env:
      SWITCHED_OFF: ${{ matrix.entry }}
    steps:
      - name: Refuse a switched-off run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "A switched-off run starts from main only." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
      - name: Sync the environment
        run: uv sync --locked
      - name: Check the entry against the provider
        run: uv run --frozen python scripts/switched_off.py dispatch "$SWITCHED_OFF" fake
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Commit
        run: git rev-parse HEAD
      # The script prints the edit, the commit, and one verdict per test.
      - name: Switched-off run
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make switched-off
          echo "::$token::"
      - name: Results
        if: always()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          for file in .kills/*/results.jsonl .chaos/results.jsonl .long/*/results.jsonl; do
            if [ -f "$file" ]; then echo "== $file"; cat "$file"; fi
          done
          echo "::$token::"
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .long/*/logs/*.log 2>/dev/null || true
          docker compose logs --no-color
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  claude:
    # The reviewer of the environment sees this name: for a switched-off run
    # it says which entry's edit runs with the key.
    name: >-
      ${{ inputs.suite == 'switched-off'
      && format('switched-off {0}', inputs.switched_off) || inputs.suite }}
      on ${{ inputs.model }}
    if: >-
      inputs.provider == 'claude' && inputs.suite != 'switched-off-rehearsal'
      && inputs.suite != 'switched-off-all' && inputs.suite != 'notify-timing'
      && inputs.suite != 'long-job'
    runs-on: ubuntu-26.04
    environment: claude-api
    # One paid run at a time. A run in progress is never cancelled: that
    # would spend the tokens and keep no result.
    concurrency:
      group: claude-api
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      SUITE: ${{ inputs.suite }}
      MODEL: ${{ inputs.model }}
      SWITCHED_OFF: ${{ inputs.switched_off }}
    steps:
      # A switched-off run is evidence for main's code: the list, the edit and
      # the tests are main's, reviewed there. A branch can drop this step from
      # its own copy; the environment's branch rule is what keeps the key from it.
      - name: Refuse a switched-off run off main
        if: inputs.suite == 'switched-off' && github.ref != 'refs/heads/main'
        run: |
          echo "A switched-off run starts from main only." >&2
          exit 1
      # Only the choice values can reach here today. The check keeps it so if
      # the input ever becomes free text. `case` tests the whole string: grep
      # would pass a value with one good line among others.
      - name: Check the model name
        run: |
          case "$MODEL" in claude-?*) ;; *) echo "Not a model id." >&2; exit 1;; esac
          case "$MODEL" in *[!a-z0-9.-]*) echo "Not a model id." >&2; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No uv cache in the job that holds the key: nothing another run saved
      # is restored here, and nothing is saved from here.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
          enable-cache: false
      - name: Sync the environment
        run: uv sync --locked
      # Before the step with the key: the entry is one of the Claude API, and
      # the model picked is the entry's. An entry of the fake provider stops here.
      - name: Check the entry against the provider and the model
        if: inputs.suite == 'switched-off'
        run: |
          uv run --frozen python scripts/switched_off.py dispatch "$SWITCHED_OFF" claude "$MODEL"
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Commit
        run: git rev-parse HEAD
      # The key is given to this step only. The runner never reads it; the
      # workers get it through docker-compose.claude.yml.
      - name: Kill runs on the Claude API
        if: inputs.suite == 'kills' || inputs.suite == 'kills-after-tool-ran'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          if [ "$SUITE" = kills-after-tool-ran ]; then export KILLS_TESTS=after_tool_ran; fi
          make kills-claude KILLS_MODEL="$MODEL"
          echo "::$token::"
      # The key is given to this step only. The script hands it to the stack
      # and the tests, runs its own git commands without it, and starts such
      # an entry only when SWITCHED_OFF_PROVIDER says so. It prints the edit,
      # the commit, a verdict per test, and PASS, FINDING or INCONCLUSIVE.
      - name: Switched-off run on the Claude API
        if: inputs.suite == 'switched-off'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          SWITCHED_OFF_PROVIDER: claude
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make switched-off
          echo "::$token::"
      # The contract test runs on the host against the normal stack's fake
      # provider and the API.
      - name: Contract test
        if: inputs.suite == 'contract'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make up
          CONTRACT_MODEL="$MODEL" uv run --frozen pytest -v tests/contract
          echo "::$token::"
      - name: Results
        if: always()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat .kills/*/results.jsonl 2>/dev/null || true
          for file in .contract/*/*; do
            if [ -f "$file" ]; then echo "== $file"; cat "$file"; fi
          done
          echo "::$token::"
      # Worker logs hold step kinds and errors, never the key.
      - name: Service logs
        if: failure()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          docker compose -f docker-compose.yml -f docker-compose.kills.yml logs --no-color worker
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean

  # The long-job harness on the Claude API: mode counts or graded through
  # `make long-job-claude`, mode must-fail through the list's entry
  # long-notices-dropped, its control job and then its edited one. The
  # harness refuses a run that `scripts/long_job_keyed.py check` refuses.
  # The job prints the records only, and they hold counts: no service log,
  # no saved worker log and no artifact leaves it. A failure here is read
  # from the record alone.
  long-job:
    # The reviewer of the environment sees the mode and the model.
    name: long-job ${{ inputs.long_job }} on ${{ inputs.model }}
    if: inputs.suite == 'long-job' && inputs.provider == 'claude'
    runs-on: ubuntu-26.04
    environment: claude-api
    # One paid run at a time, with the job above. A run in progress is never
    # cancelled: that would spend the tokens and keep no result.
    concurrency:
      group: claude-api
      cancel-in-progress: false
    # The harness's session deadline and the builds of the stack, with room.
    timeout-minutes: 350
    # The inputs reach the steps only here, as variables: never pasted into a
    # shell line.
    env:
      MODEL: ${{ inputs.model }}
      LONG_JOB_MODE: ${{ inputs.long_job }}
      LONG_JOB_TOKEN_BUDGET: ${{ inputs.token_budget }}
      LONG_JOB_JOBS: ${{ inputs.jobs }}
    steps:
      # A long-job run is evidence for main's code. A branch can drop this step
      # from its own copy; the environment's branch rule is what keeps the key
      # from it.
      - name: Refuse a long-job run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "A long-job run on the Claude API starts from main only." >&2
          exit 1
      # The harness runs one model. `case` tests the whole string.
      - name: Check the model name
        run: |
          case "$MODEL" in claude-haiku-5-5) ;; *) echo "Not its model." >&2; exit 1;; esac
      # The token budget and the number of jobs: digits, or nothing.
      - name: Check the numbers
        run: |
          for value in "$LONG_JOB_TOKEN_BUDGET" "$LONG_JOB_JOBS"; do
            case "$value" in *[!0-9]*) echo "Not digits." >&2; exit 1;; esac
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No uv cache in a job that holds the key.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          add-problem-matchers: false
          enable-cache: false
      - name: Sync the environment
        run: uv sync --locked
      # The entry runs in this job only, and only with the harness's model.
      - name: Check the entry against the provider and the model
        if: inputs.long_job == 'must-fail'
        run: |
          uv run --frozen python scripts/switched_off.py dispatch long-notices-dropped claude \
            "$MODEL" long-job
      # The run's refusals, with the seed and without the key: the pass line,
      # the budget, the jobs, the bound, the seed and its job's checks.
      - name: Check the run
        env:
          LONG_JOB_PROVIDER: claude
          LONG_JOB_SEED: ${{ secrets.LONG_JOB_SEED }}
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          uv run --frozen python scripts/long_job_keyed.py check
          echo "::$token::"
      - name: Docker socket group
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Commit
        run: git rev-parse HEAD
      # The key and the seed are given to this step only. The workers get the
      # key through docker-compose.claude.yml; in mode graded the harness
      # reads it too, after the job, for the count of the job's text.
      - name: Long job on the Claude API
        if: inputs.long_job != 'must-fail'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          LONG_JOB_SEED: ${{ secrets.LONG_JOB_SEED }}
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make long-job-claude LONG_JOB_MODEL="$MODEL"
          echo "::$token::"
      # The key and the seed are given to this step only. The script runs the
      # control job, and the edited one only after the control passed.
      - name: Switched-off run on the Claude API
        if: inputs.long_job == 'must-fail'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          LONG_JOB_SEED: ${{ secrets.LONG_JOB_SEED }}
          SWITCHED_OFF: long-notices-dropped
          SWITCHED_OFF_PROVIDER: claude
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          make switched-off
          echo "::$token::"
      # Counts only. A public log is a publication: nothing else is printed.
      - name: Results
        if: always()
        run: |
          exec 2>&1
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          for file in .long-job/*/results.jsonl; do
            if [ -f "$file" ]; then echo "== $file"; cat "$file"; fi
          done
          echo "::$token::"
      - name: Stop the stack
        if: always()
        run: make clean
