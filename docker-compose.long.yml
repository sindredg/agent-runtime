# Changes to the stack for a job longer than the context window. Used on top
# of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.long.yml up --wait
#
# `make long-up` does that, and `make long` runs tests/long on it, on the fake
# provider. `make long-job-claude` adds docker-compose.claude.yml on top, for
# the long-job harness on the Claude API. Five
# settings come from the shell. LONG_SCENARIO_DIR names the host directory of
# scenario files; unset, the packaged ones. SUMMARY_TRIGGER sets the trigger;
# unset, no job summarises. FAILPOINT and FAILPOINT_SUMMARY stop a worker at
# a named point; unset, nowhere. FAKE_TRACKER_FIRST_ISSUE sets the first
# issue number; unset, 100000. `make up` afterwards brings the normal stack
# back.
name: agent-runtime

services:
  worker:
    # Two workers, so that a job has another worker to go to. The lease and
    # the heartbeat stay at the defaults.
    deploy:
      replicas: 2
    # A worker that stopped at the failpoint comes back. One that the tests
    # killed is started by them. A failpoint that fired on every claim would
    # end on the limit of takeovers: the job fails, it does not hang.
    restart: on-failure
    environment:
      # No sandbox: run_shell and list_dir are not offered.
      SANDBOX_IMAGE: ""
      MAX_TOKENS: "32000"
      SUMMARY_TRIGGER: ${SUMMARY_TRIGGER:-}
      # Where the worker ends its own process; tests/long sets it for the
      # runs that stop a worker at a summary. With FAILPOINT_SUMMARY=1,
      # `after_model_request` stops it only at a summary request.
      FAILPOINT: ${FAILPOINT:-}
      FAILPOINT_SUMMARY: ${FAILPOINT_SUMMARY:-}

  fake-provider:
    environment:
      # The scenarios of the mounted directory only. By default that is the
      # package's own directory in the checkout, so the stack has the same set.
      FAKE_SCENARIO_DIR: /scenarios
    volumes:
      - type: bind
        source: ${LONG_SCENARIO_DIR:-./services/fake_provider/src/fake_provider/scenarios}
        target: /scenarios
        read_only: true
        # A missing directory is not created: the start stops. The fake also
        # stops when it cannot list the directory or finds no scenario in it.
        bind:
          create_host_path: false

  fake-tracker:
    environment:
      # Every issue number has six digits, so a number never changes the
      # length of a tool result. From the shell, for the run that shows
      # what another width does.
      FAKE_TRACKER_FIRST_ISSUE: ${FAKE_TRACKER_FIRST_ISSUE:-100000}
