<svg xmlns="http://www.w3.org/2000/svg" width="740" height="256" viewBox="0 0 740 256" role="img" aria-labelledby="notify-runs-title notify-runs-desc">
  <title id="notify-runs-title">The three runs of the G12 test</title>
  <desc id="notify-runs-desc">Each run parks 20 jobs. With no kill each question arrives once. With workers killed while the receiver holds a POST for 1.5 s, a killed POST is sent again as a repeat. With the receiver down for 30 s, every question arrives after its return.</desc>
  <defs>
    <marker id="notify-runs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m0 0 8 4-8 4z" fill="#bdc8d6"/>
    </marker>
  </defs>
  <rect width="740" height="256" rx="8" fill="#0d1117"/>
  <g fill="none" stroke="#bdc8d6" stroke-width="1.5" marker-end="url(#notify-runs-arrow)">
    <path d="M304 48h22"/>
    <path d="M440 48h22"/>
    <path d="M304 128h22"/>
    <path d="M440 128h22"/>
    <path d="M576 128h22"/>
    <path d="M304 208h22"/>
    <path d="M440 208h22"/>
    <path d="M576 208h22"/>
  </g>
  <g fill="#1b2531" stroke="#788798">
    <rect x="192" y="20" width="112" height="56" rx="5"/>
    <rect x="328" y="20" width="112" height="56" rx="5"/>
    <rect x="464" y="20" width="112" height="56" rx="5"/>
    <rect x="192" y="100" width="112" height="56" rx="5"/>
    <rect x="328" y="100" width="112" height="56" rx="5"/>
    <rect x="464" y="100" width="112" height="56" rx="5"/>
    <rect x="192" y="180" width="112" height="56" rx="5"/>
    <rect x="328" y="180" width="112" height="56" rx="5"/>
    <rect x="464" y="180" width="112" height="56" rx="5"/>
    <rect x="600" y="180" width="112" height="56" rx="5"/>
  </g>
  <rect x="600" y="100" width="112" height="56" rx="5" fill="#3b2b25" stroke="#ffb991"/>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#eef2f6">
    <g font-weight="600">
      <text x="24" y="44">No kill</text>
      <text x="24" y="124">Random kills</text>
      <text x="24" y="204">Receiver down</text>
    </g>
    <g font-size="14" fill="#9aa7b6">
      <text x="24" y="64">20 jobs</text>
      <text x="24" y="144">20 jobs, seeded</text>
      <text x="24" y="224">20 jobs</text>
    </g>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#eef2f6">
    <text x="248" y="44">Park writes</text>
    <text x="248" y="64">the row</text>
    <text x="384" y="44">POST,</text>
    <text x="384" y="64">answer 2xx</text>
    <text x="520" y="44">Arrives</text>
    <text x="520" y="64">exactly once</text>
    <text x="248" y="124">Park writes</text>
    <text x="248" y="144">the row</text>
    <text x="384" y="124">Receiver holds</text>
    <text x="384" y="144">the POST 1.5 s</text>
    <text x="520" y="124">Worker killed</text>
    <text x="520" y="144">in the hold</text>
    <text x="656" y="124" fill="#ffb991" font-weight="600">Sent again:</text>
    <text x="656" y="144" fill="#ffb991" font-weight="600">a repeat</text>
    <text x="248" y="204">Park writes</text>
    <text x="248" y="224">the row</text>
    <text x="384" y="204">Down 30 s,</text>
    <text x="384" y="224">tries fail</text>
    <text x="520" y="204">Receiver</text>
    <text x="520" y="224">back</text>
    <text x="656" y="204">Arrives within</text>
    <text x="656" y="224">60 s of return</text>
  </g>
</svg>
