<svg xmlns="http://www.w3.org/2000/svg" width="848" height="300" viewBox="0 0 848 300" role="img" aria-labelledby="access-review-title access-review-desc">
  <title id="access-review-title">The access review generator</title>
  <desc id="access-review-desc">A seed and a shape give an organisation, rendered as the corpus files with their index and as the prompt; with the fixed system text they make the job file. The files give one answer key, the files and the prompt's notices the other, and the commitment is a SHA-256 hash over the seed, both keys and a digest of the job.</desc>
  <defs>
    <marker id="access-review-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m0 0 8 4-8 4z" fill="#bdc8d6"/>
    </marker>
  </defs>
  <rect width="848" height="300" rx="8" fill="#0d1117"/>
  <rect x="316" y="8" width="164" height="256" rx="6" fill="none" stroke="#788798" stroke-dasharray="4,3"/>
  <text x="328" y="27" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1" fill="#9aa7b6">THE JOB FILE</text>
  <g fill="none" stroke="#bdc8d6" stroke-width="1.5" marker-end="url(#access-review-arrow)">
    <path d="M144 144H174"/>
    <path d="M296 132H302Q310 132 310 124V72Q310 64 318 64H326"/>
    <path d="M296 156H326"/>
