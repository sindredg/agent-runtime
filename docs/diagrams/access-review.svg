    <path d="M468 144H484Q492 144 492 136V80Q492 72 500 72H510"/>
    <path d="M400 264V276Q400 284 408 284H576Q584 284 584 276V254"/>
    <path d="M656 64H660Q668 64 668 72V124Q668 132 676 132H682"/>
    <path d="M656 224H660Q668 224 668 216V164Q668 156 676 156H682"/>
  </g>
  <g fill="#1b2531" stroke="#788798">
    <rect x="24" y="116" width="120" height="56" rx="5"/>
    <rect x="176" y="116" width="120" height="56" rx="5"/>
    <rect x="328" y="36" width="140" height="56" rx="5"/>
    <rect x="328" y="116" width="140" height="56" rx="5"/>
    <rect x="328" y="196" width="140" height="56" rx="5"/>
    <rect x="512" y="36" width="144" height="56" rx="5"/>
    <rect x="512" y="196" width="144" height="56" rx="5"/>
  </g>
  <rect x="684" y="116" width="140" height="56" rx="5" fill="#3b2b25" stroke="#ffb991"/>
  <g font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#eef2f6">
    <text x="84" y="140">Seed, shape</text>
    <text x="236" y="140">Organisation</text>
    <text x="398" y="60">Corpus files</text>
    <text x="398" y="140">Prompt</text>
    <text x="398" y="220">system</text>
    <text x="584" y="60">Answer keys</text>
    <text x="584" y="220">Job digest</text>
    <text x="754" y="140" fill="#ffb991">Commitment</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#9aa7b6">
    <text x="84" y="160">128 bits or more</text>
    <text x="236" y="160">teams, grants</text>
    <text x="398" y="80">and index.txt</text>
    <text x="398" y="160">rules, notices, code</text>
    <text x="398" y="240">fixed text</text>
    <text x="584" y="80">files; with notices</text>
    <text x="584" y="240">SHA-256 of the job</text>
    <text x="754" y="160" fill="#ffb991">seed, keys, job</text>
