<svg xmlns="http://www.w3.org/2000/svg" width="740" height="256" viewBox="0 0 740 256" role="img" aria-labelledby="long-job-runs-title long-job-runs-desc">
  <title id="long-job-runs-title">The runs of the long-job suite</title>
  <desc id="long-job-runs-desc">One job runs past its context window with nobody interrupting it, through three summaries and 47 requests, and is kept as the reference. A job whose worker is stopped or killed is taken over when its lease ends, its log is replayed, and it must send the same requests as the reference. A job whose summary answer is bad, or whose next window opens at the trigger, must end failed; after a bad answer no tool runs.</desc>
  <defs>
    <marker id="long-job-runs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m0 0 8 4-8 4z" fill="#bdc8d6"/>
    </marker>
  </defs>
  <rect width="740" height="256" rx="8" fill="#0d1117"/>
  <g fill="none" stroke="#bdc8d6" stroke-width="1.5" marker-end="url(#long-job-runs-arrow)">
    <path d="M304 48h22"/>
    <path d="M440 48h22"/>
    <path d="M304 128h22"/>
    <path d="M440 128h22"/>
    <path d="M576 128h22"/>
    <path d="M304 208h22"/>
    <path d="M440 208h22"/>
  </g>
  <g fill="#1b2531" stroke="#788798">
    <rect x="192" y="20" width="112" height="56" rx="5"/>
    <rect x="328" y="20" width="112" height="56" rx="5"/>
    <rect x="464" y="20" width="112" height="56" rx="5"/>
    <rect x="192" y="100" width="112" height="56" rx="5"/>
    <rect x="328" y="100" width="112" height="56" rx="5"/>
    <rect x="464" y="100" width="112" height="56" rx="5"/>
    <rect x="192" y="180" width="112" height="56" rx="5"/>
    <rect x="328" y="180" width="112" height="56" rx="5"/>
    <rect x="464" y="180" width="112" height="56" rx="5"/>
  </g>
  <rect x="600" y="100" width="112" height="56" rx="5" fill="#3b2b25" stroke="#ffb991"/>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#eef2f6">
    <g font-weight="600">
      <text x="24" y="44">Nobody interrupts</text>
      <text x="24" y="124">Stopped or killed</text>
      <text x="24" y="204">Bad summary</text>
    </g>
    <g font-size="14" fill="#9aa7b6">
      <text x="24" y="64">1 job</text>
      <text x="24" y="144">failpoints, seeded kills</text>
      <text x="24" y="224">bad answer or too large</text>
    </g>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#eef2f6">
    <text x="248" y="44">Job outgrows</text>
    <text x="248" y="64">its window</text>
    <text x="384" y="44">3 summaries,</text>
    <text x="384" y="64">47 requests</text>
    <text x="520" y="44">Kept as the</text>
    <text x="520" y="64">reference</text>
    <text x="248" y="124">Worker gone</text>
    <text x="248" y="144">in mid-job</text>
    <text x="384" y="124">Lease ends,</text>
    <text x="384" y="144">taken over</text>
    <text x="520" y="124">Log replayed,</text>
    <text x="520" y="144">job goes on</text>
    <text x="656" y="124" fill="#ffb991" font-weight="600">Same requests</text>
    <text x="656" y="144" fill="#ffb991" font-weight="600">as reference</text>
    <text x="248" y="204">Summary</text>
    <text x="248" y="224">stored</text>
    <text x="384" y="204">Not usable, or</text>
    <text x="384" y="224">at the trigger</text>
    <text x="520" y="204">Job ends</text>
    <text x="520" y="224">failed</text>
  </g>
</svg>
