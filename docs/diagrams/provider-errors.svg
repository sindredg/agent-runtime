<svg xmlns="http://www.w3.org/2000/svg" width="776" height="336" viewBox="0 0 776 336" role="img" aria-labelledby="provider-errors-title provider-errors-desc">
  <title id="provider-errors-title">What a failed model call does</title>
  <desc id="provider-errors-desc">A busy answer makes the job wait. An error that may pass makes it wait too, while it is under both caps: 10 errors in a row and 30 in the job. Over a cap, or on an error that will not pass, the job fails. After a wait any worker sends the same request again.</desc>
  <defs>
    <marker id="provider-errors-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m0 0 8 4-8 4z" fill="#bdc8d6"/>
    </marker>
  </defs>
  <rect width="776" height="336" rx="8" fill="#0d1117"/>
  <g fill="none" stroke="#bdc8d6" stroke-width="1.5" marker-end="url(#provider-errors-arrow)">
    <path d="M128 56h30"/>
    <path d="M272 56h30"/>
    <path d="M512 56h30"/>
    <path d="M216 88v86"/>
    <path d="M408 88v86"/>
    <path d="M672 88v86"/>
    <path d="M568 88v112a8 8 0 0 1-8 8h-70"/>
    <path d="M216 240v44a8 8 0 0 0 8 8h30"/>
    <path d="M672 240v44a8 8 0 0 1-8 8h-22"/>
  </g>
  <g fill="#1b2531" stroke="#788798">
    <rect x="16" y="24" width="112" height="64" rx="5"/>
    <rect x="160" y="24" width="112" height="64" rx="5"/>
    <rect x="304" y="24" width="208" height="64" rx="5"/>
    <rect x="544" y="24" width="216" height="64" rx="5"/>
    <rect x="144" y="176" width="144" height="64" rx="5"/>
    <rect x="328" y="176" width="160" height="64" rx="5"/>
    <rect x="256" y="264" width="384" height="56" rx="5"/>
  </g>
  <rect x="592" y="176" width="160" height="64" rx="5" fill="#3b2b25" stroke="#ffb991"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#eef2f6">
    <g font-size="16" font-weight="600">
      <text x="72" y="52">Model call</text>
      <text x="72" y="72">failed</text>
      <text x="216" y="51">Busy?</text>
      <text x="408" y="51">May pass?</text>
      <text x="652" y="51">Under both caps?</text>
      <text x="216" y="203">waiting</text>
      <text x="408" y="203">failed</text>
      <text x="672" y="203" fill="#ffb991">waiting</text>
      <text x="448" y="287">Any worker, after not_before</text>
    </g>
    <g font-size="14" fill="#d6dfe9">
      <text x="216" y="73">429, 529</text>
      <text x="408" y="73">5xx, 408, 409, broken stream</text>
      <text x="652" y="73">10 in a row, 30 in the job</text>
      <text x="216" y="225">provider_busy</text>
      <text x="408" y="225">error step</text>
      <text x="672" y="225" fill="#ffb991">provider_error</text>
      <text x="448" y="308">sends the same request again</text>
      <text x="288" y="46">no</text>
      <text x="528" y="46">yes</text>
      <text x="236" y="136">yes</text>
      <text x="424" y="136">no</text>
      <text x="692" y="136">yes</text>
      <text x="520" y="136">over a cap</text>
    </g>
  </g>
</svg>
