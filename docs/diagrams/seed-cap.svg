<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320" role="img" aria-labelledby="seed-cap-title seed-cap-desc">
  <title id="seed-cap-title">How large a spec's files may be</title>
  <desc id="seed-cap-desc">1.2M tokens of distinct file text at 4 bytes per token is about 4.6 MiB. A 4 MiB limit falls short of it and the 8 MiB limit holds it. The workspace watcher's limit of 1024 MiB is far above both and is not drawn to scale.</desc>
  <rect width="740" height="320" rx="8" fill="#0d1117"/>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="36" font-size="20" font-weight="600" fill="#eef2f6">How large a spec's files may be</text>
    <text x="24" y="62" font-size="16" fill="#d6dfe9">1.2M tokens of distinct text, at 4 bytes per token.</text>
  </g>
  <g stroke="#495667">
    <path d="M160 100v136"/>
    <path d="M280 100v136" stroke-dasharray="2 4"/>
    <path d="M400 100v136" stroke-dasharray="2 4"/>
    <path d="M520 100v136" stroke-dasharray="2 4"/>
    <path d="M640 100v136" stroke-dasharray="2 4"/>
    <path d="M160 236h540"/>
  </g>
  <rect x="160" y="112" width="240" height="40" rx="5" fill="#1b2531" stroke="#788798"/>
  <rect x="160" y="176" width="480" height="40" rx="5" fill="#3b2b25" stroke="#ffb991"/>
  <path d="M436 96v132" stroke="#bdc8d6" stroke-width="2" stroke-dasharray="4 4"/>
  <g font-family="system-ui, sans-serif">
    <text x="436" y="84" font-size="14" text-anchor="middle" fill="#eef2f6">needed: about 4.6 MiB</text>
    <g font-size="16" font-weight="600" fill="#eef2f6">
      <text x="24" y="130">4 MiB</text>
      <text x="24" y="194">8 MiB</text>
    </g>
    <g font-size="14" fill="#9aa7b6">
      <text x="24" y="150">not taken</text>
      <text x="24" y="214">the limit</text>
    </g>
    <text x="176" y="137" font-size="14" fill="#eef2f6">falls short</text>
    <text x="176" y="201" font-size="14" font-weight="600" fill="#ffb991">holds it</text>
    <g font-size="14" fill="#9aa7b6" text-anchor="middle">
      <text x="160" y="256">0</text>
      <text x="280" y="256">2</text>
      <text x="400" y="256">4</text>
      <text x="520" y="256">6</text>
      <text x="640" y="256">8</text>
      <text x="700" y="256">MiB</text>
    </g>
    <text x="24" y="296" font-size="16" fill="#d6dfe9">The workspace watcher's limit, 1024 MiB, is far above both. Not to scale.</text>
  </g>
</svg>
