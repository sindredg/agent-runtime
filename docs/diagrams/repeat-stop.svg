<svg xmlns="http://www.w3.org/2000/svg" width="776" height="300" viewBox="0 0 776 300" role="img" aria-labelledby="repeat-stop-title repeat-stop-desc">
  <title id="repeat-stop-title">When a job that repeats itself is stopped</title>
  <desc id="repeat-stop-desc">Each tool result with the same call and the same result as the one before adds one to a count; any other result sets it to one. Before the next model call, a count of five fails the job and the call is not sent. The count is replayed from the step log, so a worker that takes over continues it.</desc>
  <defs>
    <marker id="repeat-stop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m0 0 8 4-8 4z" fill="#bdc8d6"/>
    </marker>
  </defs>
  <rect width="776" height="300" rx="8" fill="#0d1117"/>
  <g fill="none" stroke="#bdc8d6" stroke-width="1.5" marker-end="url(#repeat-stop-arrow)">
    <path d="M160 56h30"/>
    <path d="M464 56h30"/>
    <path d="M656 88v86"/>
    <path d="M528 88v112a8 8 0 0 1-8 8h-54"/>
    <path d="M256 208H96a8 8 0 0 1-8-8V90"/>
  </g>
  <g fill="#1b2531" stroke="#788798">
    <rect x="16" y="24" width="144" height="64" rx="5"/>
    <rect x="192" y="24" width="272" height="64" rx="5"/>
    <rect x="496" y="24" width="264" height="64" rx="5"/>
    <rect x="256" y="176" width="208" height="64" rx="5"/>
  </g>
  <rect x="552" y="176" width="208" height="64" rx="5" fill="#3b2b25" stroke="#ffb991"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#eef2f6">
    <g font-size="16" font-weight="600">
      <text x="88" y="51">Tool result</text>
      <text x="328" y="51">Count</text>
      <text x="628" y="51">5 in a row?</text>
      <text x="360" y="203">Next model call</text>
      <text x="656" y="203" fill="#ffb991">failed</text>
    </g>
    <g font-size="14" fill="#d6dfe9">
      <text x="88" y="73">tool_result step</text>
      <text x="328" y="73">same call and result: +1, else 1</text>
      <text x="628" y="73">before the next model call</text>
      <text x="360" y="225">model_request, then sent</text>
      <text x="656" y="225" fill="#ffb991">error step names the limit</text>
      <text x="544" y="136">no</text>
      <text x="676" y="136">yes</text>
      <text x="96" y="152" text-anchor="start">tool runs</text>
      <text x="388" y="280">The count is replayed from the step log, so a worker that takes over continues it.</text>
    </g>
  </g>
</svg>
