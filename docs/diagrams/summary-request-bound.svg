<svg xmlns="http://www.w3.org/2000/svg" width="776" height="268" viewBox="0 0 776 268" role="img" aria-labelledby="summary-bound-title summary-bound-desc">
  <title id="summary-bound-title">The largest summary request at two triggers</title>
  <desc id="summary-bound-desc">The largest summary request holds the trigger, two tool results of 16,384 bytes, one response of 32,000 tokens, the budget's allowance and the instruction. At a trigger of 32,000 that is 99,109 tokens, under the 100,000 line past which a token costs more. At a trigger of 80,000 it is 147,109, over the line.</desc>
  <rect width="776" height="268" rx="8" fill="#0d1117"/>
  <g stroke="#2b3644" stroke-width="1">
    <path d="M120 44v152"/>
    <path d="M320 44v152"/>
  </g>
  <g stroke="#788798">
    <rect x="120" y="60" width="128" height="40" fill="#3b2b25" stroke="#ffb991"/>
    <rect x="248" y="60" width="64" height="40" fill="#1b2531"/>
    <rect x="312" y="60" width="128" height="40" fill="#1b2531"/>
    <rect x="440" y="60" width="64" height="40" fill="#1b2531"/>
    <rect x="504" y="60" width="12" height="40" fill="#1b2531"/>
    <rect x="120" y="140" width="320" height="40" fill="#1b2531"/>
    <rect x="440" y="140" width="64" height="40" fill="#1b2531"/>
    <rect x="504" y="140" width="128" height="40" fill="#1b2531"/>
    <rect x="632" y="140" width="64" height="40" fill="#1b2531"/>
    <rect x="696" y="140" width="12" height="40" fill="#1b2531"/>
  </g>
  <path d="M520 44v152" stroke="#ffb991" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-family="system-ui, sans-serif">
    <g font-size="14" fill="#d6dfe9">
      <text x="16" y="28">Largest summary request, input tokens</text>
      <text x="528" y="28" fill="#ffb991">100,000: a token costs more past it</text>
    </g>
    <g font-size="15" font-weight="600" fill="#eef2f6">
      <text x="16" y="78">Trigger</text>
      <text x="16" y="96" fill="#ffb991">32,000</text>
      <text x="16" y="158">Trigger</text>
      <text x="16" y="176">80,000</text>
    </g>
    <g font-size="13" fill="#eef2f6" text-anchor="middle">
      <text x="184" y="85">trigger</text>
      <text x="280" y="85">result</text>
      <text x="376" y="85">response</text>
      <text x="472" y="85">result</text>
      <text x="280" y="165">trigger</text>
      <text x="472" y="165">result</text>
      <text x="568" y="165">response</text>
      <text x="664" y="165">result</text>
    </g>
    <g font-size="14" font-weight="600">
      <text x="528" y="85" fill="#ffb991">99,109</text>
      <text x="716" y="165" fill="#eef2f6">147,109</text>
    </g>
    <g font-size="12" fill="#bdc8d6" text-anchor="middle">
      <text x="120" y="212">0</text>
      <text x="320" y="212">50,000</text>
      <text x="520" y="212">100,000</text>
      <text x="720" y="212">150,000</text>
    </g>
    <text x="16" y="248" font-size="13" fill="#d6dfe9">result: one file of 16,384 bytes. response: at most 32,000 tokens. Last part: the allowance and the instruction.</text>
  </g>
</svg>
