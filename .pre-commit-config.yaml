# Hooks run the tools from the project environment (uv.lock), so each tool
# version is pinned in one place: pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        # mypy checks the whole project (files set in pyproject.toml), not
        # only the staged files, so cross-module errors are caught.
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: uv run --frozen yamllint --strict
        language: system
        types: [yaml]
